spring.application.name=backend

# --- Karakter kodlamasi ---
# Spring Boot'un StringHttpMessageConverter'i zaten varsayilan olarak UTF-8 kullaniyor,
# ama bunu acikca belirtmek (force=true: hem request hem response icin) platform/versiyon
# degisikliklerinden bagimsiz garanti altina aliyor - Turkce karakterli mesajlarin (ör.
# forgot-password/validasyon hatalari) her zaman dogru kodlamayla donmesi icin.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- Aktif profil ---
# Varsayilan "prod": bir yerde unutulup profil hic belirtilmezse (ornegin gercek bir
# deploy'da) sistem GUVENLI tarafa (debug endpoint'lerin devre disi oldugu prod) duser,
# yanlislikla dev'e degil. Yerel gelistirmede bu deger backend/.env icindeki
# spring.profiles.active=dev satiriyla override ediliyor (bkz. .env.example).
spring.profiles.active=prod

# --- Gizli bilgiler (.env) ---
# .env dosyasi (proje kokunde, backend/.env) properties formatinda okunur.
# Dosya yoksa "optional:" sayesinde hata vermez, sadece asagidaki degerler tanimsiz kalir.
# .env git'e commitlenmez (.gitignore); ornek sablon icin .env.example dosyasina bak.
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL Baglanti Ayarlari ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/surumnotu}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate Ayarlari ---
# ddl-auto=update -> Entity siniflarina bakarak eksik tablo/kolonlari otomatik olusturur (Code-First yaklasimi)
spring.jpa.hibernate.ddl-auto=update
# Hibernate'in calistirdigi SQL sorgularini konsolda goster (ogrenme asamasinda faydali)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT Ayarlari ---
# Secret .env dosyasindan okunur, kod icine yazilmaz
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Ilk Admin Kullanicisi ---
# Bos birakilirsa (deger tanimsizsa) admin seed adimi atlanir
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}

# --- Gmail SMTP Ayarlari ---
# GMAIL_APP_PASSWORD normal Gmail sifresi degil, Google hesabinda uretilen "uygulama sifresi"dir
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- SADECE test/gelistirme: sifirlama kodu debug endpoint'i ---
# true olursa GET /api/auth/debug/reset-code?username=... herkese (kimlik dogrulamasiz)
# aktif sifirlama kodunu dondurur - Playwright'in gercek email kutusunu okumadan test
# yazabilmesi icindir. GERCEK BIR DEPLOY'DA ASLA true OLMAMALI (varsayilan false).
app.debug-reset-code-enabled=${DEBUG_RESET_CODE_ENABLED:false}
